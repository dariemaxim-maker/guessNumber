<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./Css/style.css">
    <title>Number Guessing Game</title>
</head>

<body>

    <div class="container text-center bg-white border mt-3 p-3 box">
        <h1 class="fw-bold display-5 mb-2">Number Guessing Game</h1>

        <div class="mb-3">
            <button class="btn btn-link text-decoration-none text-dark fs-5 p-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#istruzioniCollapse" aria-expanded="false">
                <i class="bi bi-arrow-right-circle"></i> Istruzioni
            </button>
            <div class="collapse mt-2" id="istruzioniCollapse">
                <div class="card card-body border-0 bg-transparent text-muted fst-italic">
                    Il Computer genera un numero casuale compreso tra 0 e 100. Tu dovrai indovinarlo. Hai a disposizione
                    7 tentativi.
                </div>
            </div>
        </div>

        <div>
            <button type="button" id="btnGioca" class="btn btn-primary px-4" onclick="iniziaGioco()">GIOCA</button>
        </div>
    </div>

    <div id="win" class="container mt-4 bg-white text-center p-4 border box d-none">

        <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
            <input type="number" id="num" class="form-control w-auto text-center" placeholder="numero" min="0" max="100"
                autocomplete="off">
            <button type="button" class="btn btn-info text-white fw-bold" onclick="guessNumber()">Check</button>
        </div>

        <div id="gameStatusMessage" class="my-3">
            <h2 id="statusTitle" class="fw-bold display-6"></h2>
        </div>

        <div class="row mt-4">
            <div class="col-4">
                <h5>Tentativi Rimasti</h5>
                <div class="my-2"><i class="bi bi-joystick fs-2"></i></div>
                <p id="tentativi" class="fs-5 m-0">7</p>
            </div>

            <div class="col-4">
                <h5>Suggerimenti</h5>
                <div class="my-2"><i class="bi bi-info-square fs-2"></i></div>
                <p id="suggerimento" class="suggestion-text m-0 fst-italic">-</p>
            </div>

            <div class="col-4">
                <h5>Numeri inseriti</h5>
                <div class="my-2"><i class="bi bi-pencil-square fs-2"></i></div>
                <p id="numeriInseriti" class="fs-5 m-0">-</p>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="./Js/script.js"></script>
</body>

</html>
